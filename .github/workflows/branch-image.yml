name: Branch Image

on:
  push:
    branches:
      - feature/terra-dulupay-affiliate
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: branch-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build production image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image metadata
        id: image
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          BRANCH_TAG="${GITHUB_REF_NAME//\//-}"
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "name=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "branch_tag=${BRANCH_TAG}" >> "${GITHUB_OUTPUT}"
          echo "sha_tag=${BRANCH_TAG}-${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "version=${BRANCH_TAG}-${SHORT_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.branch_tag }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}

      - name: Print image tags
        run: |
          echo "Published:"
          echo "${{ steps.image.outputs.name }}:${{ steps.image.outputs.branch_tag }}"
          echo "${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}"
