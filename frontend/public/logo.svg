<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">STApi</title>
  <desc id="desc">The letters S and T drawn as a star trail, with a four-point star rising above the T.</desc>
  <defs>
    <linearGradient id="st-bg" x1="60" y1="30" x2="452" y2="482" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B1640"/>
      <stop offset=".55" stop-color="#0C0B24"/>
      <stop offset="1" stop-color="#05060F"/>
    </linearGradient>
    <radialGradient id="st-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400 110) rotate(135) scale(380)">
      <stop stop-color="#D946EF" stop-opacity=".32"/>
      <stop offset=".5" stop-color="#6366F1" stop-opacity=".12"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="st-ink" x1="80" y1="140" x2="440" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="st-star" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(418 104) scale(70)">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".35" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F0ABFC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#st-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#st-glow)"/>
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="119.25" fill="none" stroke="#C4B5FD" stroke-opacity=".2" stroke-width="1.5"/>

  <!-- 背景小星 -->
  <g fill="#FFFFFF">
    <circle cx="96" cy="96" r="4" opacity=".7"/>
    <circle cx="156" cy="64" r="2.5" opacity=".5"/>
    <circle cx="300" cy="436" r="3" opacity=".5"/>
    <circle cx="448" cy="420" r="3.5" opacity=".6"/>
  </g>

  <!-- S T -->
  <g fill="none" stroke="url(#st-ink)" stroke-linecap="round" stroke-linejoin="round" stroke-width="46">
    <path d="M222 182C206 156 180 146 150 147C112 149 90 171 92 199C95 230 125 242 158 252C196 264 228 280 226 318C224 356 190 378 150 376C118 374 96 360 82 338"/>
    <path d="M276 170H426"/>
    <path d="M351 170V378"/>
  </g>

  <!-- 主星 -->
  <circle cx="418" cy="104" r="70" fill="url(#st-star)" opacity=".55"/>
  <path d="M418 54C422 86 432 98 466 104C432 110 422 122 418 154C414 122 404 110 370 104C404 98 414 86 418 54Z" fill="#FFFFFF"/>
</svg>
